<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Login page */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background: #1a1a2e;
            padding: 20px;
        }

        .login-page.hidden {
            display: none;
        }

        .login-box {
            background: white;
            border-radius: 14px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 6px;
            color: #1a1a2e;
            font-size: 24px;
        }

        .login-box .login-sub {
            text-align: center;
            color: #888;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .login-box label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s;
            appearance: none;
        }

        .login-box input:focus {
            border-color: #27ae60;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #219a52;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            padding: 14px 10px;
            padding-bottom: 30px;
        }

        .dashboard.visible {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 14px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            border: 2px solid transparent;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card.active {
            border-color: #27ae60;
        }

        .card-label {
            font-size: 15px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .card-amount {
            font-size: 42px;
            font-weight: 700;
            color: #27ae60;
        }

        .card-sub {
            font-size: 14px;
            color: #aaa;
            margin-top: 3px;
        }

        .breakdown {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            display: none;
            margin-bottom: 10px;
        }

        .breakdown.visible {
            display: block;
        }

        .breakdown-header {
            background: #2c3e50;
            color: white;
            padding: 12px 14px;
            font-size: 16px;
            font-weight: 600;
        }

        .breakdown-table {
            width: 100%;
            border-collapse: collapse;
        }

        .breakdown-table thead {
            background: #34495e;
            color: white;
        }

        .breakdown-table th {
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .breakdown-table th:nth-child(2) {
            text-align: right;
        }

        .breakdown-table th:nth-child(3) {
            text-align: right;
        }

        .breakdown-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 20px;
        }

        .breakdown-table td:nth-child(1) {
            font-weight: 500;
        }

        .breakdown-table td:nth-child(2) {
            text-align: right;
            font-weight: 700;
            font-size: 26px;
            color: #27ae60;
        }

        .breakdown-table td:nth-child(3) {
            text-align: right;
            width: 90px;
        }

        .breakdown-table tr:last-child td {
            border-bottom: none;
        }

        .trend-bar-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 18px;
        }

        .trend-bar {
            height: 16px;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 3px;
            min-width: 4px;
        }

        .total-row td {
            font-weight: 700 !important;
            border-top: 2px solid #2c3e50;
            font-size: 26px !important;
            background: #f8f9fa;
        }

        /* Desktop overrides */
        @media (min-width: 768px) {
            .dashboard {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .container {
                max-width: 800px;
                margin: 0 auto;
            }

            .cards {
                flex-direction: row;
                gap: 20px;
            }

            .card {
                flex: 1;
                padding: 24px;
            }

            .card:hover {
                box-shadow: 0 4px 16px rgba(0,0,0,0.12);
                transform: translateY(-2px);
            }

            .card:active {
                transform: translateY(-2px);
            }

            .card-amount {
                font-size: 36px;
            }

            .breakdown-table th {
                padding: 10px 20px;
            }

            .breakdown-table td {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-page" id="login-page">
        <div class="login-box">
            <h2>Account Login</h2>
            <p class="login-sub">Sign in to view your dashboard</p>
            <form onsubmit="handleLogin(event)">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="username">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
    <div class="container">
        <div class="header">
            <h1>Jake Dobbs: Recent Earnings</h1>
            <button class="clear-btn" onclick="clearAndRegenerate()">Refresh</button>
        </div>

        <div class="cards">
            <div class="card" id="daily-card" onclick="toggleBreakdown('daily')">
                <div class="card-label">Daily Income Snapshot</div>
                <div class="card-amount" id="daily-total"></div>
                <div class="card-sub">Today's earnings — tap for details</div>
            </div>
            <div class="card" id="weekly-card" onclick="toggleBreakdown('weekly')">
                <div class="card-label">Weekly Income Snapshot</div>
                <div class="card-amount" id="weekly-total"></div>
                <div class="card-sub">This week's earnings — tap for details</div>
            </div>
        </div>

        <div class="breakdown" id="daily-breakdown">
            <div class="breakdown-header">Daily Sales Snapshot</div>
            <table class="breakdown-table">
                <thead>
                    <tr><th>Date</th><th>Gross</th><th>Trend</th></tr>
                </thead>
                <tbody id="daily-body"></tbody>
            </table>
        </div>

        <div class="breakdown" id="weekly-breakdown">
            <div class="breakdown-header">Weekly Sales Snapshot</div>
            <table class="breakdown-table">
                <thead>
                    <tr><th>Week Ending</th><th>Gross</th><th>Trend</th></tr>
                </thead>
                <tbody id="weekly-body"></tbody>
            </table>
        </div>
    </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dashboard').classList.add('visible');
        }

        const STORAGE_KEY = 'earnings_dashboard_data';

        function generateWeightedAmount() {
            const roll = Math.random();
            let amount;
            if (roll < 0.3) {
                amount = 300 + Math.random() * 150;
            } else if (roll < 0.7) {
                amount = 400 + Math.random() * 300;
            } else {
                amount = 700 + Math.random() * 400;
            }
            return Math.round(amount * 100) / 100;
        }

        function generateData() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const dailyAmounts = [];
            for (let i = 27; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);

                const trendFactor = 0.75 + (27 - i) * (0.5 / 27);
                let amount = generateWeightedAmount() * trendFactor;
                amount = Math.max(300, Math.min(1100, Math.round(amount * 100) / 100));

                dailyAmounts.push({
                    date: date.toISOString().split('T')[0],
                    amount: amount
                });
            }

            const daily = dailyAmounts.slice(-7);

            const weekly = [];
            for (let w = 0; w < 4; w++) {
                const weekDays = dailyAmounts.slice(w * 7, (w + 1) * 7);
                const weekTotal = weekDays.reduce((sum, d) => sum + d.amount, 0);
                const weekEnd = new Date(weekDays[weekDays.length - 1].date);
                const weekStart = new Date(weekDays[0].date);
                weekly.push({
                    endDate: weekEnd.toISOString().split('T')[0],
                    startDate: weekStart.toISOString().split('T')[0],
                    amount: Math.round(weekTotal * 100) / 100
                });
            }

            return { daily, weekly };
        }

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                return JSON.parse(stored);
            }
            const data = generateData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            return data;
        }

        function formatCurrency(amount) {
            return '$' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T12:00:00');
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${days[d.getDay()]}  ${months[d.getMonth()]} ${d.getDate()}`;
        }

        function formatWeekDate(dateStr) {
            const d = new Date(dateStr + 'T12:00:00');
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function render(data) {
            const todayAmount = data.daily[data.daily.length - 1].amount;
            document.getElementById('daily-total').textContent = formatCurrency(todayAmount);

            const thisWeekAmount = data.weekly[data.weekly.length - 1].amount;
            document.getElementById('weekly-total').textContent = formatCurrency(thisWeekAmount);

            const dailyBody = document.getElementById('daily-body');
            const dailyMax = Math.max(...data.daily.map(d => d.amount));
            const dailyTotal = data.daily.reduce((sum, d) => sum + d.amount, 0);

            let dailyHTML = '';
            for (let i = data.daily.length - 1; i >= 0; i--) {
                const d = data.daily[i];
                const barWidth = Math.round((d.amount / dailyMax) * 100);
                dailyHTML += `<tr>
                    <td>${formatDate(d.date)}</td>
                    <td>${formatCurrency(d.amount)}</td>
                    <td><div class="trend-bar-container"><div class="trend-bar" style="width: ${barWidth}%"></div></div></td>
                </tr>`;
            }
            dailyHTML += `<tr class="total-row">
                <td>7-Day Total</td>
                <td>${formatCurrency(Math.round(dailyTotal * 100) / 100)}</td>
                <td></td>
            </tr>`;
            dailyBody.innerHTML = dailyHTML;

            const weeklyBody = document.getElementById('weekly-body');
            const weeklyMax = Math.max(...data.weekly.map(w => w.amount));
            const weeklyTotal = data.weekly.reduce((sum, w) => sum + w.amount, 0);

            let weeklyHTML = '';
            for (let i = data.weekly.length - 1; i >= 0; i--) {
                const w = data.weekly[i];
                const barWidth = Math.round((w.amount / weeklyMax) * 100);
                const label = i === data.weekly.length - 1
                    ? `${formatWeekDate(w.endDate)} (current)`
                    : formatWeekDate(w.endDate);
                weeklyHTML += `<tr>
                    <td>${label}</td>
                    <td>${formatCurrency(w.amount)}</td>
                    <td><div class="trend-bar-container"><div class="trend-bar" style="width: ${barWidth}%"></div></div></td>
                </tr>`;
            }
            weeklyHTML += `<tr class="total-row">
                <td>4-Week Total</td>
                <td>${formatCurrency(Math.round(weeklyTotal * 100) / 100)}</td>
                <td></td>
            </tr>`;
            weeklyBody.innerHTML = weeklyHTML;
        }

        let activeBreakdown = null;

        function toggleBreakdown(type) {
            const dailyEl = document.getElementById('daily-breakdown');
            const weeklyEl = document.getElementById('weekly-breakdown');
            const dailyCard = document.getElementById('daily-card');
            const weeklyCard = document.getElementById('weekly-card');

            if (activeBreakdown === type) {
                dailyEl.classList.remove('visible');
                weeklyEl.classList.remove('visible');
                dailyCard.classList.remove('active');
                weeklyCard.classList.remove('active');
                activeBreakdown = null;
                return;
            }

            dailyEl.classList.toggle('visible', type === 'daily');
            weeklyEl.classList.toggle('visible', type === 'weekly');
            dailyCard.classList.toggle('active', type === 'daily');
            weeklyCard.classList.toggle('active', type === 'weekly');
            activeBreakdown = type;
        }

        function clearAndRegenerate() {
            localStorage.removeItem(STORAGE_KEY);
            const data = loadData();
            render(data);
        }

        const data = loadData();
        render(data);
    </script>
</body>
</html>
