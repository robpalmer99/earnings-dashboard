<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 0;
        }

        /* Login page */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
        }

        .login-page.hidden {
            display: none;
        }

        .login-box {
            background: white;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 6px;
            color: #1a1a2e;
            font-size: 22px;
        }

        .login-box .login-sub {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .login-box label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }

        .login-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-box input:focus {
            border-color: #27ae60;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #219a52;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            padding: 30px 20px;
        }

        .dashboard.visible {
            display: block;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            border: 2px solid transparent;
        }

        .card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }

        .card.active {
            border-color: #27ae60;
        }

        .card-label {
            font-size: 14px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-amount {
            font-size: 36px;
            font-weight: 700;
            color: #27ae60;
        }

        .card-sub {
            font-size: 13px;
            color: #aaa;
            margin-top: 6px;
        }

        .breakdown {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            display: none;
        }

        .breakdown.visible {
            display: block;
        }

        .breakdown-header {
            background: #2c3e50;
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .breakdown-table {
            width: 100%;
            border-collapse: collapse;
        }

        .breakdown-table thead {
            background: #34495e;
            color: white;
        }

        .breakdown-table th {
            padding: 10px 20px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .breakdown-table th:nth-child(2),
        .breakdown-table th:nth-child(3) {
            text-align: right;
        }

        .breakdown-table td {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .breakdown-table td:nth-child(2) {
            text-align: right;
            font-weight: 600;
            color: #27ae60;
        }

        .breakdown-table td:nth-child(3) {
            text-align: right;
            width: 120px;
        }

        .breakdown-table tr:last-child td {
            border-bottom: none;
        }

        .breakdown-table tr:hover {
            background: #f8f9fa;
        }

        .trend-bar-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 16px;
        }

        .trend-bar {
            height: 14px;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 2px;
            min-width: 4px;
        }

        .total-row td {
            font-weight: 700 !important;
            border-top: 2px solid #2c3e50;
            font-size: 15px !important;
            background: #f8f9fa;
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .card-amount {
                font-size: 28px;
            }
            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="login-page" id="login-page">
        <div class="login-box">
            <h2>Account Login</h2>
            <p class="login-sub">Sign in to view your dashboard</p>
            <form onsubmit="handleLogin(event)">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="username">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
    <div class="container">
        <div class="header">
            <h1>Jake Dobbs: Recent Earnings</h1>
            <button class="clear-btn" onclick="clearAndRegenerate()">Refresh</button>
        </div>

        <div class="cards">
            <div class="card" id="daily-card" onclick="toggleBreakdown('daily')">
                <div class="card-label">Daily Income Snapshot</div>
                <div class="card-amount" id="daily-total"></div>
                <div class="card-sub">Today's earnings — click for details</div>
            </div>
            <div class="card" id="weekly-card" onclick="toggleBreakdown('weekly')">
                <div class="card-label">Weekly Income Snapshot</div>
                <div class="card-amount" id="weekly-total"></div>
                <div class="card-sub">This week's earnings — click for details</div>
            </div>
        </div>

        <div class="breakdown" id="daily-breakdown">
            <div class="breakdown-header">Daily Sales Snapshot</div>
            <table class="breakdown-table">
                <thead>
                    <tr><th>Date</th><th>Gross</th><th>Trend</th></tr>
                </thead>
                <tbody id="daily-body"></tbody>
            </table>
        </div>

        <div class="breakdown" id="weekly-breakdown">
            <div class="breakdown-header">Weekly Sales Snapshot</div>
            <table class="breakdown-table">
                <thead>
                    <tr><th>Week Ending</th><th>Gross Sales</th><th>Trend</th></tr>
                </thead>
                <tbody id="weekly-body"></tbody>
            </table>
        </div>
    </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dashboard').classList.add('visible');
        }

        const STORAGE_KEY = 'earnings_dashboard_data';

        function generateWeightedAmount() {
            // Mix of distributions for real variety:
            // 30% chance of low ($300-$450), 40% chance of mid ($400-$700), 30% chance of high ($700-$1100)
            const roll = Math.random();
            let amount;
            if (roll < 0.3) {
                amount = 300 + Math.random() * 150; // $300-$450
            } else if (roll < 0.7) {
                amount = 400 + Math.random() * 300; // $400-$700
            } else {
                amount = 700 + Math.random() * 400; // $700-$1100
            }
            return Math.round(amount * 100) / 100;
        }

        function generateData() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Generate 28 days of data (4 weeks) with upward trend
            const dailyAmounts = [];
            for (let i = 27; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);

                // Trend multiplier: oldest day ~0.75, newest day ~1.25
                const trendFactor = 0.75 + (27 - i) * (0.5 / 27);
                let amount = generateWeightedAmount() * trendFactor;
                amount = Math.max(300, Math.min(1100, Math.round(amount * 100) / 100));

                dailyAmounts.push({
                    date: date.toISOString().split('T')[0],
                    amount: amount
                });
            }

            // Last 7 days for daily snapshot
            const daily = dailyAmounts.slice(-7);

            // 4 weeks for weekly snapshot
            const weekly = [];
            for (let w = 0; w < 4; w++) {
                const weekDays = dailyAmounts.slice(w * 7, (w + 1) * 7);
                const weekTotal = weekDays.reduce((sum, d) => sum + d.amount, 0);
                const weekEnd = new Date(weekDays[weekDays.length - 1].date);
                const weekStart = new Date(weekDays[0].date);
                weekly.push({
                    endDate: weekEnd.toISOString().split('T')[0],
                    startDate: weekStart.toISOString().split('T')[0],
                    amount: Math.round(weekTotal * 100) / 100
                });
            }

            return { daily, weekly };
        }

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                return JSON.parse(stored);
            }
            const data = generateData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            return data;
        }

        function formatCurrency(amount) {
            return '$' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T12:00:00');
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${days[d.getDay()]}    ${months[d.getMonth()]}${d.getDate()}`;
        }

        function formatWeekDate(dateStr) {
            const d = new Date(dateStr + 'T12:00:00');
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function render(data) {
            // Today's earnings (last item in daily)
            const todayAmount = data.daily[data.daily.length - 1].amount;
            document.getElementById('daily-total').textContent = formatCurrency(todayAmount);

            // This week's earnings (last item in weekly)
            const thisWeekAmount = data.weekly[data.weekly.length - 1].amount;
            document.getElementById('weekly-total').textContent = formatCurrency(thisWeekAmount);

            // Daily breakdown - show most recent first
            const dailyBody = document.getElementById('daily-body');
            const dailyMax = Math.max(...data.daily.map(d => d.amount));
            const dailyTotal = data.daily.reduce((sum, d) => sum + d.amount, 0);

            let dailyHTML = '';
            for (let i = data.daily.length - 1; i >= 0; i--) {
                const d = data.daily[i];
                const barWidth = Math.round((d.amount / dailyMax) * 100);
                dailyHTML += `<tr>
                    <td>${formatDate(d.date)}</td>
                    <td>${formatCurrency(d.amount)}</td>
                    <td><div class="trend-bar-container"><div class="trend-bar" style="width: ${barWidth}%"></div></div></td>
                </tr>`;
            }
            dailyHTML += `<tr class="total-row">
                <td>7-Day Total</td>
                <td>${formatCurrency(Math.round(dailyTotal * 100) / 100)}</td>
                <td></td>
            </tr>`;
            dailyBody.innerHTML = dailyHTML;

            // Weekly breakdown - show most recent first
            const weeklyBody = document.getElementById('weekly-body');
            const weeklyMax = Math.max(...data.weekly.map(w => w.amount));
            const weeklyTotal = data.weekly.reduce((sum, w) => sum + w.amount, 0);

            let weeklyHTML = '';
            for (let i = data.weekly.length - 1; i >= 0; i--) {
                const w = data.weekly[i];
                const barWidth = Math.round((w.amount / weeklyMax) * 100);
                const label = i === data.weekly.length - 1
                    ? `${formatWeekDate(w.endDate)}    (current week)`
                    : formatWeekDate(w.endDate);
                weeklyHTML += `<tr>
                    <td>${label}</td>
                    <td>${formatCurrency(w.amount)}</td>
                    <td><div class="trend-bar-container"><div class="trend-bar" style="width: ${barWidth}%"></div></div></td>
                </tr>`;
            }
            weeklyHTML += `<tr class="total-row">
                <td>4-Week Total</td>
                <td>${formatCurrency(Math.round(weeklyTotal * 100) / 100)}</td>
                <td></td>
            </tr>`;
            weeklyBody.innerHTML = weeklyHTML;
        }

        let activeBreakdown = null;

        function toggleBreakdown(type) {
            const dailyEl = document.getElementById('daily-breakdown');
            const weeklyEl = document.getElementById('weekly-breakdown');
            const dailyCard = document.getElementById('daily-card');
            const weeklyCard = document.getElementById('weekly-card');

            if (activeBreakdown === type) {
                dailyEl.classList.remove('visible');
                weeklyEl.classList.remove('visible');
                dailyCard.classList.remove('active');
                weeklyCard.classList.remove('active');
                activeBreakdown = null;
                return;
            }

            dailyEl.classList.toggle('visible', type === 'daily');
            weeklyEl.classList.toggle('visible', type === 'weekly');
            dailyCard.classList.toggle('active', type === 'daily');
            weeklyCard.classList.toggle('active', type === 'weekly');
            activeBreakdown = type;
        }

        function clearAndRegenerate() {
            localStorage.removeItem(STORAGE_KEY);
            const data = loadData();
            render(data);
        }

        // Init
        const data = loadData();
        render(data);
    </script>
</body>
</html>
